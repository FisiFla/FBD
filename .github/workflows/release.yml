name: Release

# Tag-triggered release build (v1.4.0 style). Requires repository secrets
# (see below). Without the Apple secrets the workflow still runs, but the
# result is published as a clearly-marked PRERELEASE with an asset named
# FBD-unsigned.zip, so an unsigned build can never pass for a real release.
#
# Required secrets (Repository → Settings → Secrets and variables → Actions):
#   APPLE_CERT_BASE64          base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD        password of the .p12
#   APPLE_ID                   Apple ID for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (not the account password)
#   APPLE_TEAM_ID              team id (e.g. ABCDE12345)
# Optional:
#   SPARKLE_ED_PRIVATE_KEY     Sparkle EdDSA private key; when present the
#                              workflow regenerates appcast.xml from the
#                              signed zip (otherwise that step is skipped).
#
# Local equivalent: RELEASING.md (make bump-version → sign → notarytool).

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release, upload assets, commit appcast.xml

jobs:
  release:
    name: Test, build, sign, notarize, publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Build universal app
        run: make app STRICT_UNIVERSAL=1

      - name: Check signing secrets
        id: check
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_BASE64 != '' }}
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          echo "has_cert=$HAS_CERT" >> "$GITHUB_OUTPUT"
          echo "has_sparkle_key=$HAS_SPARKLE_KEY" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: steps.check.outputs.has_cert == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # Inside-out, no --deep: --deep applies one set of options to everything
      # and does not sign Sparkle's helpers the way notarization requires.
      # Order: XPC services / Autoupdate / Updater.app → framework → app.
      - name: Codesign (Sparkle helpers, framework, app)
        if: steps.check.outputs.has_cert == 'true'
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk '{print $2}')
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the keychain"; exit 1; }
          SPARKLE=build/FBD.app/Contents/Frameworks/Sparkle.framework
          sign() { codesign --force --options runtime --timestamp --sign "$IDENTITY" "$@"; }
          for xpc in "$SPARKLE"/Versions/*/XPCServices/*.xpc; do
            if [ -e "$xpc" ]; then sign --preserve-metadata=entitlements "$xpc"; fi
          done
          for helper in "$SPARKLE"/Versions/*/Autoupdate "$SPARKLE"/Versions/*/Updater.app; do
            if [ -e "$helper" ]; then sign "$helper"; fi
          done
          sign "$SPARKLE"
          sign build/FBD.app
          codesign --verify --strict --verbose=2 "$SPARKLE"
          codesign --verify --strict --verbose=2 build/FBD.app

      - name: Notarize and staple
        if: steps.check.outputs.has_cert == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/FBD.app build/FBD-notarize.zip
          xcrun notarytool submit build/FBD-notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple build/FBD.app
          xcrun stapler validate build/FBD.app
          spctl -a -vv build/FBD.app
          rm -f build/FBD-notarize.zip
          ditto -c -k --keepParent build/FBD.app build/FBD.zip

      - name: Zip unsigned app
        if: steps.check.outputs.has_cert != 'true'
        run: ditto -c -k --keepParent build/FBD.app build/FBD-unsigned.zip

      # Only with the Sparkle key AND a signed build: generate_appcast refuses
      # ad-hoc-signed apps by design, and the edSignature must cover the exact
      # zip that is published.
      - name: Generate appcast
        id: appcast
        if: steps.check.outputs.has_cert == 'true' && steps.check.outputs.has_sparkle_key == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          TOOL="$(find .build -type f -name generate_appcast -perm -u+x | head -1)"
          [ -n "$TOOL" ] || { echo "::error::generate_appcast not found in the Sparkle package artifacts"; exit 1; }
          DIR="$RUNNER_TEMP/appcast"
          rm -rf "$DIR" && mkdir -p "$DIR"
          cp build/FBD.zip "$DIR/FBD.zip"
          # Keep earlier items: generate_appcast merges into an existing feed.
          cp appcast.xml "$DIR/appcast.xml"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$TOOL" --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            "$DIR"
          cp "$DIR/appcast.xml" build/appcast.xml
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Skip appcast notice
        if: steps.appcast.outputs.generated != 'true'
        run: echo "::notice::appcast.xml not updated (needs the Apple signing secrets and SPARKLE_ED_PRIVATE_KEY). Update it manually per RELEASING.md step 4."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CERT: ${{ steps.check.outputs.has_cert }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # The git tag is v1.5.0 but the CHANGELOG heading is [1.5.0]. Without
          # stripping the prefix the match finds nothing, so every release
          # ships with empty notes.
          VERSION="${TAG#v}"
          # Anchored to the start of a line (an unanchored pattern also matches
          # a passing mention of a heading inside prose). awk rather than
          # `head -n -1`, which BSD head on macOS runners rejects.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; print; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > build/notes.md
          if [ "$HAS_CERT" = "true" ]; then
            ASSETS=(build/FBD.zip)
            if [ -f build/appcast.xml ]; then ASSETS+=(build/appcast.xml); fi
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "FBD $TAG" --notes-file build/notes.md
          else
            {
              echo "> **UNSIGNED BUILD** — not signed with a Developer ID and not notarized."
              echo "> Gatekeeper will block it; see the README Install section. Do not distribute as a release."
              echo
              cat build/notes.md
            } > build/notes-unsigned.md
            echo "::warning::Release signing secrets not configured — published an UNSIGNED PRERELEASE (FBD-unsigned.zip)."
            gh release create "$TAG" build/FBD-unsigned.zip \
              --prerelease --title "FBD $TAG (unsigned)" --notes-file build/notes-unsigned.md
          fi

      # Keeps the in-repo feed (SUFeedURL points at main) in step with the
      # release. Branch protection may reject the push; that must not fail an
      # already-published release, so it is a warning and the release asset
      # copy of appcast.xml is the fallback.
      - name: Commit appcast.xml
        if: steps.appcast.outputs.generated == 'true'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp build/appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "appcast: add ${TAG#v}" || exit 0
          git push origin HEAD:main || echo "::warning::could not push appcast.xml to main; copy it from the release assets"
