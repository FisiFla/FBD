name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (macOS)
    # macos-15 is an Apple Silicon (arm64) runner, so DDC and the other
    # arm64-only private-API paths build and run here without a separate job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Select Xcode 26+
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then echo "::error::Xcode 26+ not found on runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # The key covers the sources and manifest so a cached .build can never
      # outlive the code it was compiled from; restore-keys only falls back to
      # a cache with the same manifest + lockfile (SwiftPM then rebuilds
      # incrementally).
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Build (debug)
        run: swift build --disable-sandbox

      - name: Run tests
        run: swift test --disable-sandbox

      # Optimised builds compile differently (whole-module, no -Onone); catch
      # release-only failures on every PR, not at tag time.
      - name: Build (release)
        run: swift build --disable-sandbox -c release

      # STRICT_UNIVERSAL=1: a failed arm64+x86_64 build must fail CI instead of
      # silently falling back to a native-only binary (the Makefile default for
      # local builds).
      - name: Build universal app bundle
        run: make app STRICT_UNIVERSAL=1 UNIVERSAL_LOG="$RUNNER_TEMP/fbd-universal.log"

      - name: Upload universal build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: fbd-universal-log
          path: ${{ runner.temp }}/fbd-universal.log
          if-no-files-found: ignore

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: FBD-app
          path: build/FBD.app
          if-no-files-found: error
